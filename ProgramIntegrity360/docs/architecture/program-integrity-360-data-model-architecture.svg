<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">Program Integrity 360 data model architecture</title>
  <desc id="desc">The six case-intake objects flow into the Program Integrity Case aggregate. Eight related Data Fabric entities use logical string joins. A lower band shows Case Management, Maestro Flow, Maestro BPMN, RPA, API workflows, agents, and human review.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516174"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f05a28"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #58677a; }
      .section { font: 700 20px Arial, Helvetica, sans-serif; letter-spacing: 1.6px; fill: #657387; }
      .entity-title { font: 700 23px Arial, Helvetica, sans-serif; fill: #172033; }
      .entity-id { font: 400 13px Arial, Helvetica, sans-serif; fill: #66768a; }
      .field { font: 400 16px Arial, Helvetica, sans-serif; fill: #29364a; }
      .field-key { font: 700 16px Arial, Helvetica, sans-serif; fill: #172033; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #5c6c80; }
      .small-dark { font: 600 14px Arial, Helvetica, sans-serif; fill: #29364a; }
      .pill { font: 700 16px Arial, Helvetica, sans-serif; fill: #29364a; }
      .band-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #172033; }
      .band-text { font: 400 14px Arial, Helvetica, sans-serif; fill: #526174; }
      .edge-label { font: 700 13px Arial, Helvetica, sans-serif; fill: #4f5e70; paint-order: stroke; stroke: #f7f9fc; stroke-width: 5px; stroke-linejoin: round; }
      .card { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .case-card { fill: #fff7f2; stroke: #f05a28; stroke-width: 3; rx: 22; filter: url(#shadow); }
      .header-orange { fill: #f05a28; }
      .header-blue { fill: #eaf2ff; }
      .header-teal { fill: #e7f8f4; }
      .header-purple { fill: #f1edfb; }
      .edge { fill: none; stroke: #516174; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #6c7c90; stroke-width: 2.5; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .edge-input { fill: none; stroke: #f05a28; stroke-width: 3; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="2400" height="1500" fill="#f7f9fc"/>

  <text x="64" y="68" class="title">Program Integrity 360 — Data Model Architecture</text>
  <text x="64" y="104" class="subtitle">Live uipathlabs / Playground model • 9 Data Fabric entities • 59 records • State Medicaid PCS + Hospice</text>

  <text x="64" y="154" class="section">CASE INTAKE CONTRACT</text>
  <rect x="54" y="178" width="360" height="650" rx="22" fill="#ffffff" stroke="#d7dee8" stroke-width="2" filter="url(#shadow)"/>
  <text x="84" y="218" class="small-dark">Manual trigger — six required objects</text>

  <g>
    <rect x="82" y="246" width="304" height="72" rx="14" fill="#fff2eb" stroke="#fac4ad"/>
    <text x="104" y="276" class="pill">caseInput</text>
    <text x="104" y="299" class="small">caseId • caseType • requesterEmail</text>
  </g>
  <g>
    <rect x="82" y="332" width="304" height="72" rx="14" fill="#edf4ff" stroke="#bfd4fb"/>
    <text x="104" y="362" class="pill">claimInput</text>
    <text x="104" y="385" class="small">claimId • units • billed • threshold</text>
  </g>
  <g>
    <rect x="82" y="418" width="304" height="72" rx="14" fill="#eef9f6" stroke="#b8e2d8"/>
    <text x="104" y="448" class="pill">memberInput</text>
    <text x="104" y="471" class="small">memberId • Medicaid ID • demographics</text>
  </g>
  <g>
    <rect x="82" y="504" width="304" height="72" rx="14" fill="#f5f0ff" stroke="#d7c9f3"/>
    <text x="104" y="534" class="pill">providerInput</text>
    <text x="104" y="557" class="small">providerId • caregiver / attendant</text>
  </g>
  <g>
    <rect x="82" y="590" width="304" height="82" rx="14" fill="#fff8e8" stroke="#f1d498"/>
    <text x="104" y="620" class="pill">serviceEventInput</text>
    <text x="104" y="643" class="small">line • service date • claimed interval</text>
    <text x="104" y="661" class="small">place of service • units</text>
  </g>
  <g>
    <rect x="82" y="686" width="304" height="112" rx="14" fill="#eef7fb" stroke="#bcdbe8"/>
    <text x="104" y="716" class="pill">documentInput</text>
    <text x="104" y="739" class="small">bucket paths • IXP models</text>
    <text x="104" y="759" class="small">hospitalRecordAvailable</text>
    <text x="104" y="779" class="small">patientClass = Observation</text>
  </g>

  <text x="470" y="154" class="section">LIVE DATA FABRIC</text>
  <rect x="1590" y="124" width="746" height="52" rx="12" fill="#fff2eb" stroke="#fac4ad"/>
  <text x="1614" y="156" class="small-dark">Logical string joins • Flow + BPMN in scope • IXP, RPA and auto-email deferred</text>

  <!-- Relationship connectors sit behind entity cards. -->
  <path class="edge-input" d="M 414 482 C 520 482, 604 250, 800 250"/>

  <path class="edge" d="M 980 360 C 980 398, 700 398, 700 432"/>
  <text x="747" y="397" class="edge-label">provider_id</text>
  <path class="edge" d="M 1110 360 L 1110 432"/>
  <text x="1124" y="404" class="edge-label">attendant_id</text>
  <path class="edge" d="M 1240 360 C 1240 398, 1455 398, 1455 432"/>
  <text x="1300" y="397" class="edge-label">case_id</text>
  <path class="edge-dashed" d="M 1665 538 L 1750 538"/>
  <text x="1671" y="521" class="edge-label">attendant + member + date</text>

  <path class="edge" d="M 890 360 C 890 646, 750 646, 750 700"/>
  <text x="790" y="652" class="edge-label">case_id</text>
  <path class="edge" d="M 1050 360 C 1050 640, 1120 640, 1120 700"/>
  <text x="1072" y="652" class="edge-label">case_id</text>
  <path class="edge" d="M 1330 360 C 1330 640, 1505 640, 1505 700"/>
  <text x="1376" y="652" class="edge-label">case_id</text>
  <path class="edge" d="M 1495 360 C 1495 640, 1970 640, 1970 700"/>
  <text x="1765" y="652" class="edge-label">case_id</text>
  <path class="edge" d="M 860 528 L 900 528"/>
  <text x="859" y="510" class="edge-label">provider_id</text>

  <!-- Aggregate root -->
  <g>
    <rect x="800" y="188" width="850" height="172" class="case-card"/>
    <rect x="800" y="188" width="850" height="50" rx="20" class="header-orange"/>
    <path d="M800 218 Q800 238 820 238 H1630 Q1650 238 1650 218 V238 H800 Z" fill="#f05a28"/>
    <text x="828" y="222" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">PI360ProgramIntegrityCase</text>
    <text x="1622" y="221" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2 records • aggregate root</text>
    <text x="828" y="262" class="entity-id">497c2d5c-7492-f111-b338-000d3ab4d3b7</text>
    <text x="828" y="294" class="field-key">case_id* (unique)</text>
    <text x="828" y="322" class="field">case_type • program • stage • status • priority</text>
    <text x="1225" y="294" class="field">provider_id • attendant_id • member_id</text>
    <text x="1225" y="322" class="field">claim totals • requester_email • maestro_instance_id</text>
    <text x="828" y="345" class="small">Case type allows MedicaidPCS or StateMedicaidHospice</text>
  </g>

  <!-- Provider -->
  <g>
    <rect x="500" y="432" width="360" height="196" class="card"/>
    <rect x="500" y="432" width="360" height="44" rx="17" class="header-purple"/>
    <text x="522" y="461" class="entity-title">PI360Provider</text>
    <text x="838" y="460" text-anchor="end" class="small-dark">1</text>
    <text x="522" y="500" class="entity-id">6e7c2d5c-7492-f111-b338-000d3ab4d3b7</text>
    <text x="522" y="530" class="field-key">provider_id* (unique)</text>
    <text x="522" y="556" class="field">name • Medicaid ID • NPI</text>
    <text x="522" y="582" class="field">enrollment • watch list</text>
    <text x="522" y="608" class="field">integrity history</text>
  </g>

  <!-- Attendant -->
  <g>
    <rect x="900" y="432" width="320" height="196" class="card"/>
    <rect x="900" y="432" width="320" height="44" rx="17" class="header-purple"/>
    <text x="922" y="461" class="entity-title">PI360Attendant</text>
    <text x="1198" y="460" text-anchor="end" class="small-dark">2</text>
    <text x="922" y="500" class="entity-id">827c2d5c-7492-f111-b338-000d3ab4d3b7</text>
    <text x="922" y="530" class="field-key">attendant_id* (unique)</text>
    <text x="922" y="556" class="field">provider_id • name • role</text>
    <text x="922" y="582" class="field">credentials • expiry</text>
    <text x="922" y="608" class="field">personnel document status</text>
  </g>

  <!-- Claim -->
  <g>
    <rect x="1260" y="432" width="430" height="196" class="card"/>
    <rect x="1260" y="432" width="430" height="44" rx="17" class="header-blue"/>
    <text x="1282" y="461" class="entity-title">PI360Claim</text>
    <text x="1668" y="460" text-anchor="end" class="small-dark">10</text>
    <text x="1282" y="500" class="entity-id">947c2d5c-7492-f111-b338-000d3ab4d3b7</text>
    <text x="1282" y="530" class="field-key">claim_id* (unique) • case_id</text>
    <text x="1282" y="556" class="field">provider / attendant / member IDs</text>
    <text x="1282" y="582" class="field">units • rate • amount • source lines</text>
    <text x="1282" y="608" class="field">place of service • claimed interval</text>
  </g>

  <!-- EVV -->
  <g>
    <rect x="1750" y="432" width="390" height="196" class="card"/>
    <rect x="1750" y="432" width="390" height="44" rx="17" class="header-blue"/>
    <text x="1772" y="461" class="entity-title">PI360EvvVisit</text>
    <text x="2118" y="460" text-anchor="end" class="small-dark">12</text>
    <text x="1772" y="500" class="entity-id">b2acb462-7492-f111-b338-000d3ab4d3b7</text>
    <text x="1772" y="530" class="field-key">evv_id* (unique)</text>
    <text x="1772" y="556" class="field">attendant_id • member_id • date</text>
    <text x="1772" y="582" class="field">start / end • units • capture method</text>
    <text x="1772" y="608" class="field">GPS confirmation • overlap reference</text>
  </g>

  <!-- Evidence -->
  <g>
    <rect x="500" y="700" width="460" height="248" class="card"/>
    <rect x="500" y="700" width="460" height="44" rx="17" class="header-teal"/>
    <text x="522" y="729" class="entity-title">PI360EvidenceDocument</text>
    <text x="938" y="728" text-anchor="end" class="small-dark">9</text>
    <text x="522" y="768" class="entity-id">deacb462-7492-f111-b338-000d3ab4d3b7</text>
    <text x="522" y="798" class="field-key">doc_id* (unique) • case_id</text>
    <text x="522" y="824" class="field">doc_type • storage_uri • source</text>
    <text x="522" y="850" class="field">extracted_fields • confidence • validation</text>
    <text x="522" y="876" class="field">ixp_model • ixp_model_version</text>
    <text x="522" y="902" class="field">patient class • encounter interval / facility</text>
    <text x="522" y="928" class="small-dark">Timesheet • Hospital Record • Policy Reference</text>
  </g>

  <!-- Risk -->
  <g>
    <rect x="1000" y="700" width="350" height="248" class="card"/>
    <rect x="1000" y="700" width="350" height="44" rx="17" fill="#fff3e7"/>
    <text x="1022" y="729" class="entity-title">PI360RiskSignal</text>
    <text x="1328" y="728" text-anchor="end" class="small-dark">6</text>
    <text x="1022" y="768" class="entity-id">c6acb462-7492-f111-b338-000d3ab4d3b7</text>
    <text x="1022" y="798" class="field-key">signal_id* (unique) • case_id</text>
    <text x="1022" y="824" class="field">rule expression • inputs</text>
    <text x="1022" y="850" class="field">result • severity • version</text>
    <text x="1022" y="876" class="field">computed_by • computed_at</text>
    <text x="1022" y="918" class="small-dark">Hospice: 360-minute location/time conflict</text>
  </g>

  <!-- Action -->
  <g>
    <rect x="1390" y="700" width="380" height="248" class="card"/>
    <rect x="1390" y="700" width="380" height="44" rx="17" fill="#f1edfb"/>
    <text x="1412" y="729" class="entity-title">PI360InvestigationAction</text>
    <text x="1748" y="728" text-anchor="end" class="small-dark">15</text>
    <text x="1412" y="768" class="entity-id">f2acb462-7492-f111-b338-000d3ab4d3b7</text>
    <text x="1412" y="798" class="field-key">action_id* (unique) • case_id</text>
    <text x="1412" y="824" class="field">action_type • actor • actor_kind</text>
    <text x="1412" y="850" class="field">timestamp • detail</text>
    <text x="1412" y="876" class="field">before_value • after_value</text>
    <text x="1412" y="918" class="small-dark">Shared append-only audit stream</text>
  </g>

  <!-- Decision -->
  <g>
    <rect x="1810" y="700" width="360" height="248" class="card"/>
    <rect x="1810" y="700" width="360" height="44" rx="17" fill="#f1edfb"/>
    <text x="1832" y="729" class="entity-title">PI360Decision</text>
    <text x="2148" y="728" text-anchor="end" class="small-dark">2</text>
    <text x="1832" y="768" class="entity-id">05adb462-7492-f111-b338-000d3ab4d3b7</text>
    <text x="1832" y="798" class="field-key">decision_id* (unique) • case_id</text>
    <text x="1832" y="824" class="field">decision type • role</text>
    <text x="1832" y="850" class="field">recommended_by • decided_by</text>
    <text x="1832" y="876" class="field">rationale • approved • decided_at</text>
    <text x="1832" y="918" class="small-dark">Investigator + supervisor decisions</text>
  </g>

  <!-- Orchestration ownership band -->
  <text x="64" y="1020" class="section">ORCHESTRATION AND OWNERSHIP</text>
  <rect x="54" y="1044" width="2282" height="300" rx="22" fill="#ffffff" stroke="#d7dee8" stroke-width="2" filter="url(#shadow)"/>

  <g>
    <rect x="82" y="1080" width="330" height="180" rx="16" fill="#fff2eb" stroke="#fac4ad"/>
    <text x="106" y="1114" class="band-title">1 • Intake + triage</text>
    <text x="106" y="1146" class="band-text">Case Management routes CaseType</text>
    <text x="106" y="1172" class="band-text">API writes the Case aggregate</text>
    <text x="106" y="1198" class="band-text">Triage agent explains the rule</text>
    <text x="106" y="1234" class="small-dark">Key: case_id</text>
  </g>

  <path class="edge-input" d="M 412 1170 L 470 1170"/>
  <g>
    <rect x="470" y="1080" width="330" height="180" rx="16" fill="#edf4ff" stroke="#bfd4fb"/>
    <text x="494" y="1114" class="band-title">2 • Evidence acquisition</text>
    <text x="494" y="1146" class="band-text">Maestro Flow orchestrates</text>
    <text x="494" y="1172" class="band-text">Beeceptor claim detail API</text>
    <text x="494" y="1198" class="band-text">Rules use claim + document metadata</text>
    <text x="494" y="1234" class="small-dark">PI360CaseManagerFlow</text>
  </g>

  <path class="edge" d="M 800 1170 L 858 1170"/>
  <g>
    <rect x="858" y="1080" width="330" height="180" rx="16" fill="#eef9f6" stroke="#b8e2d8"/>
    <text x="882" y="1114" class="band-title">3 • Hospice request</text>
    <text x="882" y="1146" class="band-text">Maestro BPMN orchestrates</text>
    <text x="882" y="1172" class="band-text">72-hour timer + response intake</text>
    <text x="882" y="1198" class="band-text">Hospital-record metadata intake</text>
    <text x="882" y="1234" class="small-dark">PCS skips this stage</text>
  </g>

  <path class="edge" d="M 1188 1170 L 1246 1170"/>
  <g>
    <rect x="1246" y="1080" width="330" height="180" rx="16" fill="#f5f0ff" stroke="#d7c9f3"/>
    <text x="1270" y="1114" class="band-title">4 • Investigation</text>
    <text x="1270" y="1146" class="band-text">Agentic Caseworker first pass</text>
    <text x="1270" y="1172" class="band-text">Evidence cited to the investigator</text>
    <text x="1270" y="1198" class="band-text">Human confirms true investigation</text>
    <text x="1270" y="1234" class="small-dark">Agents recommend • people decide</text>
  </g>

  <path class="edge" d="M 1576 1170 L 1634 1170"/>
  <g>
    <rect x="1634" y="1080" width="330" height="180" rx="16" fill="#eef7fb" stroke="#bcdbe8"/>
    <text x="1658" y="1114" class="band-title">5 • Supervisor review</text>
    <text x="1658" y="1146" class="band-text">Investigator findings supplied directly</text>
    <text x="1658" y="1172" class="band-text">Investigator findings first</text>
    <text x="1658" y="1198" class="band-text">Agentic evidence remains selectable</text>
    <text x="1658" y="1234" class="small-dark">Supervisor disposition is human</text>
  </g>

  <path class="edge" d="M 1964 1170 L 2022 1170"/>
  <g>
    <rect x="2022" y="1080" width="286" height="180" rx="16" fill="#fff8e8" stroke="#f1d498"/>
    <text x="2046" y="1114" class="band-title">6 • Closure</text>
    <text x="2046" y="1146" class="band-text">API persists disposition</text>
    <text x="2046" y="1172" class="band-text">Audit + next steps retained</text>
    <text x="2046" y="1198" class="band-text">Email automation deferred</text>
    <text x="2046" y="1234" class="small-dark">No sent / queued claim</text>
  </g>

  <!-- Footer legend -->
  <line x1="64" y1="1380" x2="2336" y2="1380" stroke="#d7dee8" stroke-width="2"/>
  <text x="64" y="1418" class="small-dark">Legend</text>
  <line x1="142" y1="1412" x2="204" y2="1412" stroke="#516174" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="222" y="1418" class="small">logical string join</text>
  <line x1="410" y1="1412" x2="472" y2="1412" stroke="#6c7c90" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="490" y="1418" class="small">composite evidence correlation</text>
  <rect x="760" y="1398" width="18" height="18" rx="4" fill="#f05a28"/>
  <text x="792" y="1418" class="small">aggregate root / Case routing</text>
  <text x="1106" y="1418" class="small">* required + unique natural key</text>
  <text x="1510" y="1418" class="small">System Id + CreatedBy / UpdatedBy / RecordOwner omitted for readability</text>
  <text x="64" y="1462" class="small">Choice sets: Priority • CaseStage • CaseStatus • ClaimStatus • DocType • ValidationStatus • CaptureMethod • GPSConfirmed • ActorKind • DecisionRole</text>
  <text x="2336" y="1462" text-anchor="end" class="small-dark">Program Integrity 360 • synthetic demonstration data</text>
</svg>
